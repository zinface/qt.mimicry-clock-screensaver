<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>星空背景</title>
    <style>
        * {
            margin: 0;
        }
    </style>
</head>


<body>

<div>
    <canvas id="canvas"></canvas>
    <canvas id="snow"></canvas>

    <div class="am-g" style="position: fixed; bottom: 0px;">
        <div class="am-u-sm-12">
            <div style="z-index: 9999" id="player" class="aplayer">
            </div>
        </div>
    </div>
</div>
<!-- CSS代码 -->
<style type="text/css">
    canvas {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: -1;
    }
    
    .github-corner:hover 
    .octo-arm{animation:octocat-wave 560ms ease-in-out}
    @keyframes octocat-wave{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-25deg)}40%,80%{transform:rotate(10deg)}}@media (max-width:500px){.github-corner:hover .octo-arm{animation:none}.github-corner 
    .octo-arm{animation:octocat-wave 560ms ease-in-out}}
</style>



</body>
<!-- Html代码 -->

<script type="text/javascript">
    var url = "https://api.gumengya.com/Api/DmImg?format=image&appkey=b7a782741f667201b54880c925faec4b";
    var canvas = document.getElementById("canvas");
    var ctx = canvas.getContext("2d");
    var w = canvas.width = window.innerWidth;
    var h = canvas.height = window.innerHeight;
    // draw image
    var img = new Image();
    img.src = url;
    img.onload = function () {
        ctx.drawImage(img, 0, 0, w, h);
    };
</script>

</html>
